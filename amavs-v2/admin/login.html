<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | AMAVS Admin</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{--gold:#C8A84B;--navy:#0D1B3E;--gray-100:#F1F5F9;--gray-200:#E2E8F0;--text:#0F172A;--text2:#475569;--text3:#94A3B8;--red:#DC2626;--red-bg:#FEE2E2;}
    body{font-family:'Outfit',system-ui,sans-serif;background:linear-gradient(135deg,var(--navy) 0%,#162B5C 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
    .login-wrap{width:100%;max-width:400px;}
    .login-brand{text-align:center;margin-bottom:2rem;}
    .lb-icon{width:60px;height:60px;background:var(--gold);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto .75rem;font-size:1.6rem;font-weight:700;color:var(--navy);}
    .lb-name{font-size:1.3rem;font-weight:700;color:#fff;letter-spacing:.04em;}
    .lb-sub{font-size:.75rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;}
    .login-card{background:#fff;border-radius:20px;padding:2.5rem;box-shadow:0 20px 48px rgba(0,0,0,.2);}
    .login-card h2{font-size:1.15rem;font-weight:700;color:var(--navy);margin-bottom:.25rem;}
    .login-card p{font-size:.82rem;color:var(--text3);margin-bottom:1.75rem;}
    .demo-box{background:var(--gray-100);border-radius:10px;padding:.9rem 1rem;margin-bottom:1.5rem;font-size:.8rem;}
    .demo-box .dt{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:.5rem;}
    .demo-box .dc{display:flex;gap:1.5rem;}
    .demo-box .df{display:flex;flex-direction:column;gap:2px;}
    .demo-box .dl{font-size:.68rem;color:var(--text3);}
    .demo-box .dv{font-family:monospace;font-size:.85rem;font-weight:700;color:var(--navy);background:#fff;padding:2px 8px;border-radius:5px;}
    .fgroup{margin-bottom:1rem;}
    .flabel{display:block;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:.4rem;}
    .finput-wrap{position:relative;}
    .finput-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.85rem;}
    .finput{width:100%;padding:.72rem 1rem .72rem 2.5rem;border:1.5px solid var(--gray-200);border-radius:9px;font-size:.9rem;font-family:'Outfit',sans-serif;color:var(--text);transition:.2s;}
    .finput:focus{outline:none;border-color:var(--gold);}
    .toggle-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;}
    .err-msg{background:var(--red-bg);border:1px solid rgba(220,38,38,.2);border-radius:8px;padding:.65rem 1rem;font-size:.82rem;color:var(--red);margin-bottom:1rem;display:none;align-items:center;gap:8px;}
    .btn-login{width:100%;padding:1rem;background:var(--navy);color:#fff;border:none;border-radius:9px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;transition:.2s;}
    .btn-login:hover{background:#162B5C;}
    .btn-login:disabled{opacity:.6;cursor:not-allowed;}
    .back-link{text-align:center;margin-top:1.25rem;font-size:.8rem;color:rgba(255,255,255,.4);}
    .back-link a{color:rgba(255,255,255,.6);}
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-brand">
    <div class="lb-icon">A</div>
    <div class="lb-name">AMAVS Admin</div>
    <div class="lb-sub">Painel de gerenciamento</div>
  </div>
  <div class="login-card">
    <h2>Acessar o painel</h2>
    <p>Entre com suas credenciais abaixo.</p>
    <div class="demo-box">
      <div class="dt"><i class="fas fa-info-circle"></i> Credenciais de demonstração</div>
      <div class="dc">
        <div class="df"><div class="dl">Usuário</div><div class="dv">admin</div></div>
        <div class="df"><div class="dl">Senha</div><div class="dv">admin123</div></div>
      </div>
    </div>
    <div class="err-msg" id="errMsg"><i class="fas fa-exclamation-circle"></i><span id="errText"></span></div>
    <form id="loginForm">
      <div class="fgroup"><label class="flabel">Usuário</label><div class="finput-wrap"><i class="fas fa-user"></i><input type="text" id="username" class="finput" placeholder="seu.usuario" autocomplete="username" required/></div></div>
      <div class="fgroup"><label class="flabel">Senha</label><div class="finput-wrap"><i class="fas fa-lock"></i><input type="password" id="password" class="finput" placeholder="••••••••" autocomplete="current-password" required/><button type="button" class="toggle-eye" onclick="toggleEye()"><i class="fas fa-eye" id="eyeIcon"></i></button></div></div>
      <button type="submit" class="btn-login" id="loginBtn"><i class="fas fa-sign-in-alt" style="margin-right:6px"></i>Entrar no painel</button>
    </form>
  </div>
  <div class="back-link"><a href="../index.html"><i class="fas fa-arrow-left"></i> Voltar ao site</a></div>
</div>
<script>
function toggleEye(){const p=document.getElementById('password'),i=document.getElementById('eyeIcon');p.type=p.type==='password'?'text':'password';i.className=p.type==='password'?'fas fa-eye':'fas fa-eye-slash';}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('loginBtn'),err=document.getElementById('errMsg'),errT=document.getElementById('errText');
  const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;
  if(!u||!p){errT.textContent='Preencha usuário e senha.';err.style.display='flex';return;}
  btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Autenticando...';
  err.style.display='none';
  await new Promise(r=>setTimeout(r,900));
  const users=[{user:'admin',pass:'admin123',role:'admin'},{user:'operador',pass:'op2024',role:'operator'}];
  const found=users.find(x=>x.user===u&&x.pass===p);
  if(found){sessionStorage.setItem('amavs_admin',JSON.stringify({user:found.user,role:found.role,ts:Date.now()}));location.href='index.html';}
  else{errT.textContent='Usuário ou senha incorretos.';err.style.display='flex';btn.disabled=false;btn.innerHTML='<i class="fas fa-sign-in-alt" style="margin-right:6px"></i>Entrar no painel';}
});
</script>
</body>
</html>
